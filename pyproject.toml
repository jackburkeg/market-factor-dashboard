[project]
name = "market-factor-dashboard"
version = "0.1.0"
description = "Interactive research dashboard relating stock returns to fundamentals, commodities, rates and market conditions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14.2",
  "scikit-learn>=1.5",
  "pyportfolioopt>=1.5.6",
  "streamlit>=1.50",
  "plotly>=5.22",
  "pyarrow>=16",
  "requests>=2.32",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
